context:
  version: "4.1.1"

package:
  name: libqrencode
  version: ${{ version }}

source:
  url: https://github.com/fukuchi/libqrencode/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 5385bc1b8c2f20f3b91d258bf8ccc8cf62023935df2d2676b5b67049f31a049c

build:
  number: 1

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - pkg-config
    - if: unix
      then:
        - autoconf
        - automake
        - libtool
        - make
      else:
        - cmake
        - ninja
  host:
    - libpng
    - zlib
    - if: win
      then:
        - getopt-win32
  run_exports:
    - ${{ pin_subpackage("libqrencode", upper_bound="x.x") }}

tests:
  - script:
      - qrencode --version
      - qrencode 123456789 -o test.png
  - package_contents:
      include:
        - qrencode.h
      lib:
        - qrencode
      bin:
        - qrencode

about:
  homepage: https://fukuchi.org/works/qrencode/
  summary: A fast and compact QR Code encoding library
  description: |
    Libqrencode is a fast and compact library for encoding data in a QR Code
    symbol, a 2D symbology that can be scanned by handy terminals such as a
    mobile phone with CCD. The capacity of QR Code is up to 7000 digits or
    4000 characters and has high robustness.
  license: LGPL-2.1-or-later
  license_file: COPYING
  repository: https://github.com/fukuchi/libqrencode
  documentation: https://fukuchi.org/works/qrencode/manual/index.html

extra:
  recipe-maintainers:
    - chrisburr
